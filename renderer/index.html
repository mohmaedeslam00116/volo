<!doctype html>
<html lang="ar" dir="rtl">
<meta charset="utf-8">
<title>Volo prototype</title>
<style>
  body { font-family: Segoe UI, Tahoma, sans-serif; margin: 16px; }
  #log { border: 1px solid #ccc; height: 420px; overflow-y: auto; padding: 8px; }
  .ev { border-bottom: 1px dotted #ddd; padding: 4px; font-size: 13px; }
  .ev pre { direction: ltr; text-align: left; background: #f6f6f6; padding: 4px; }
  #row { display: flex; gap: 8px; margin-top: 8px; }
  #prompt { flex: 1; }
</style>
<h2>Volo — نموذج أولي</h2>
<div id="log"></div>
<div id="row">
  <input id="prompt" placeholder="اكتب مهمة… (مثال: list files)">
  <button id="go">ابدأ جلسة</button>
</div>
<script>
  const log = document.getElementById("log");
  const add = (t, obj) => {
    const d = document.createElement("div");
    d.className = "ev";
    // bidi-safe: user/model text as textContent (auto dir), code as LTR pre
    d.textContent = t;
    if (obj) {
      const p = document.createElement("pre");
      p.textContent = obj;
      d.appendChild(p);
    }
    log.appendChild(d);
    log.scrollTop = log.scrollHeight;
  };
  window.volo.onEvent((m) => add(`[${m.evt}]`, JSON.stringify(m.payload).slice(0, 600)));
  document.getElementById("go").onclick = async () => {
    const p = document.getElementById("prompt").value || "list files in the workspace";
    add("starting session…");
    try {
      const { sessionId } = await window.volo.start(p);
      add("session: " + sessionId);
    } catch (e) { add("ERROR: " + e.message); }
  };
</script>
